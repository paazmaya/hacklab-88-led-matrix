<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LED Matrix Controller</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #fff;
        text-align: center;
        margin-bottom: 10px;
      }
      .subtitle {
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        margin-bottom: 30px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-row {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }
      .form-row .form-group {
        flex: 1;
        margin-bottom: 0;
      }
      label {
        display: block;
        color: #fff;
        margin-bottom: 8px;
        font-size: 0.95em;
      }
      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 1.1em;
      }
      input[type="color"] {
        width: 100%;
        height: 48px;
        padding: 4px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.1);
        cursor: pointer;
      }
      input[type="range"] {
        width: 100%;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.2);
        outline: none;
        accent-color: #e94560;
        cursor: pointer;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        margin-bottom: 20px;
        cursor: pointer;
        user-select: none;
      }
      .checkbox-group input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #e94560;
        cursor: pointer;
      }
      input[type="text"]:focus,
      input[type="number"]:focus {
        outline: none;
        border-color: #e94560;
      }
      input[type="text"]::placeholder,
      input[type="number"]::placeholder {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.9em;
      }
      .button-group {
        display: flex;
        gap: 10px;
      }
      button {
        flex: 2;
        padding: 14px;
        background: linear-gradient(135deg, #e94560, #ff6b6b);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 1.05em;
        cursor: pointer;
        text-transform: uppercase;
        font-weight: 600;
      }
      button:hover {
        transform: translateY(-2px);
      }
      .btn-clear {
        flex: 1;
        background: #232742;
        border: 1px solid rgba(255, 255, 255, 0.25);
        text-decoration: none;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
        color: #ffffff;
        font-size: 0.95em;
        text-transform: uppercase;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-clear:hover {
        background: rgba(255, 75, 75, 0.4);
      }
      .info {
        margin-top: 25px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        border-left: 4px solid #e94560;
      }
      .info h3 {
        color: #fff;
        margin-bottom: 8px;
      }
      .info p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.88em;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>LED Matrix</h1>
      <p class="subtitle">88x88 RGB Display Controller</p>
      <form action="/text" method="get">
        <div class="form-group">
          <label for="msg">Text to display:</label>
          <input
            type="text"
            id="msg"
            name="msg"
            placeholder="Type your message..."
            maxlength="32"
          />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="x">X Position:</label>
            <input type="number" id="x" name="x" placeholder="Center" min="-88" max="88" />
          </div>
          <div class="form-group">
            <label for="y">Y Position:</label>
            <input type="number" id="y" name="y" placeholder="Center" min="-88" max="88" />
          </div>
          <div class="form-group">
            <label for="color">Color:</label>
            <input type="color" id="color" name="color" value="#ffffff" />
          </div>
        </div>
        <div class="form-group">
          <label for="brightness">Brightness: <span id="bright-val">50%</span></label>
          <input
            type="range"
            id="brightness"
            name="brightness"
            min="5"
            max="100"
            step="5"
            value="50"
            oninput="document.getElementById('bright-val').innerText = this.value + '%'"
            onchange="fetch('/brightness?val=' + this.value)"
          />
        </div>
        <label class="checkbox-group">
          <input type="checkbox" name="clear" value="1" checked />
          Clear screen before drawing
        </label>
        <div class="button-group">
          <button type="submit">Display Text</button>
          <a href="/clear" class="btn-clear">Clear</a>
        </div>
      </form>
      <div class="info">
        <h3>Information</h3>
        <p>
          Controls an 88x88 RGB matrix. Supports arbitrary (X, Y) positions, 24-bit hex colors,
          overlays, and up to 32 characters per message.
        </p>
      </div>
    </div>
  </body>
</html>
